name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff format
        run: ruff format --check src tests/unit tests/integration tests/e2e tests/conftest.py
      - name: ruff lint
        run: ruff check src tests/unit tests/integration tests/e2e tests/conftest.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: unit tests
        run: pytest tests/unit -q
      - name: integration tests
        run: pytest tests/integration -q
      - name: end-to-end tests
        run: pytest tests/e2e -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pip-audit
      - name: bandit (fail on high severity)
        run: bandit -r src -q --severity-level high
      - name: bandit full report (informational)
        run: bandit -r src -q || true
      - name: dependency audit
        run: pip-audit --strict || echo "::warning::pip-audit reported issues (non-blocking in V1, see SECURITY.md)"

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: install wheel and smoke the CLI
        run: |
          pip install dist/*.whl ruff
          pmpe validate examples/taskflow_mvp_spec.yaml
          pmpe contract validate examples/v2-demo/contract.json
      - name: full pipeline smoke (golden spec)
        run: |
          git config --global user.email ci@localhost
          git config --global user.name ci
          pmpe run examples/taskflow_mvp_spec.yaml --runs-dir /tmp/ci-runs
      - name: eval suites (agents + planted trajectory fixture)
        run: |
          pmpe evals run --suite all --ledger evals/fixtures/trajectory/good_run.jsonl
      - name: drift gate holds on a planted regression
        run: |
          if pmpe drift compare --baseline evals/baselines/synthetic-baseline.json \
              --current evals/fixtures/drift/current_hard_gate_failure.json; then
            echo "expected HOLD (exit 3) on the planted hard-gate failure" && exit 1
          fi
      - name: synthetic end-to-end demo
        run: |
          pmpe demo --base-dir /tmp/ci-demo
