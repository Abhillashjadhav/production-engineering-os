name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff format
        run: ruff format --check src tests/unit tests/integration tests/e2e tests/conftest.py scripts/ci/classify_frontend_ci.py
      - name: ruff lint
        run: ruff check src tests/unit tests/integration tests/e2e tests/conftest.py scripts/ci/classify_frontend_ci.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: mypy --strict
        run: mypy --strict src/pmpe scripts/ci/classify_frontend_ci.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: unit tests
        run: pytest tests/unit -q
      - name: integration tests
        run: pytest tests/integration -q
      - name: end-to-end tests
        run: pytest tests/e2e -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pip-audit
      - name: bandit (fail on high severity)
        run: bandit -r src scripts/ci/classify_frontend_ci.py -q --severity-level high
      - name: bandit full report (informational)
        run: bandit -r src scripts/ci/classify_frontend_ci.py -q || true
      - name: dependency audit
        run: pip-audit --strict || echo "::warning::pip-audit reported issues (non-blocking in V1, see SECURITY.md)"

  product-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "products/pm-evals-web/backend[dev]"
      - name: comparison-engine tests
        run: pytest products/pm-evals-web/backend/tests -q
      - name: comparison-engine types
        working-directory: products/pm-evals-web/backend
        run: mypy
      - name: comparison-engine lint
        working-directory: products/pm-evals-web/backend
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: dependency audit (backend lockfile blocks on any known vuln)
        working-directory: products/pm-evals-web/backend
        run: |
          pip install pip-audit
          pip-audit --require-hashes -r requirements.lock --strict

  product-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/pm-evals-web/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify frontend impact
        id: frontend-paths
        continue-on-error: true
        working-directory: .
        run: |
          python3 scripts/ci/classify_frontend_ci.py \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --repo-root . \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/pm-evals-web/frontend/package-lock.json
      - name: install
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: npm ci
      - name: dependency audit (high severity blocks)
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: npm audit --audit-level=high
      - name: typed client is current with the committed contract
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: |
          npm run generate:api-types
          git diff --exit-code src/lib/api-types
      - name: typecheck
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: npx tsc --noEmit
      - name: unit and component tests
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: npx vitest run
      - name: production build
        if: steps.frontend-paths.outcome != 'success' || steps.frontend-paths.outputs.applicable != 'false'
        run: npm run build
      - name: frontend CI routing result
        if: always()
        working-directory: .
        env:
          CLASSIFIER_APPLICABLE: ${{ steps.frontend-paths.outputs.applicable }}
          CLASSIFIER_OUTCOME: ${{ steps.frontend-paths.outcome }}
        run: |
          if [[ "$CLASSIFIER_OUTCOME" != "success" || "$CLASSIFIER_APPLICABLE" != "false" ]]; then
            decision="APPLICABLE — full frontend security and validation suite executed"
          else
            decision="NOT APPLICABLE — no frontend-affecting paths changed"
          fi
          echo "$decision"
          echo "### $decision" >> "$GITHUB_STEP_SUMMARY"

  product-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "products/pm-evals-web/backend"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            products/pm-evals-web/frontend/package-lock.json
            products/pm-evals-web/e2e/package-lock.json
      - name: build the production frontend
        working-directory: products/pm-evals-web/frontend
        run: |
          npm ci
          npm run build
      - name: install e2e harness and browser
        working-directory: products/pm-evals-web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: browser verification (a11y, keyboard, responsive, journeys)
        working-directory: products/pm-evals-web/e2e
        run: npx playwright test
      - name: upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            products/pm-evals-web/e2e/test-results/
            products/pm-evals-web/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  product-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pmpe (preview evidence tooling)
        run: pip install -e "."
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/pm-evals-web/e2e/package-lock.json
      - name: build and start the containerized preview
        run: docker compose -f products/pm-evals-web/docker-compose.yml up -d --build --wait
      - name: browser suite against the containers (no mocks)
        working-directory: products/pm-evals-web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_EXTERNAL_SERVERS=1 npx playwright test
      - name: record and verify digest-bound preview evidence
        run: |
          BUILD_ID="$(docker compose -f products/pm-evals-web/docker-compose.yml exec -T frontend cat /usr/share/nginx/html/BUILD_ID)"
          python products/pm-evals-web/scripts/preview_evidence.py record \
            --kind containerized_preview \
            --build-id "$BUILD_ID" \
            --out products/pm-evals-web/preview-evidence.json \
            --journeys a11y=passed keyboard=passed responsive=passed journeys=passed
          python products/pm-evals-web/scripts/preview_evidence.py verify \
            --path products/pm-evals-web/preview-evidence.json
      - name: the digest binding fails closed on a doctored record
        run: |
          python - <<'EOF'
          import json, pathlib
          path = pathlib.Path("products/pm-evals-web/preview-evidence.json")
          data = json.loads(path.read_text())
          data["source_digest"] = "sha256:" + "0" * 64
          path.write_text(json.dumps(data))
          EOF
          if python products/pm-evals-web/scripts/preview_evidence.py verify \
              --path products/pm-evals-web/preview-evidence.json; then
            echo "::error::a doctored preview record verified — the binding is broken"
            exit 1
          fi
          echo "doctored record refused, as required"
      - name: upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-artifacts
          path: |
            products/pm-evals-web/e2e/test-results/
            products/pm-evals-web/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: teardown
        if: always()
        run: docker compose -f products/pm-evals-web/docker-compose.yml down -v

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: install wheel and smoke the CLI
        run: |
          pip install dist/*.whl ruff
          pmpe validate examples/taskflow_mvp_spec.yaml
          pmpe contract validate examples/v2-demo/contract.json
      - name: full pipeline smoke (golden spec)
        run: |
          git config --global user.email ci@localhost
          git config --global user.name ci
          pmpe run examples/taskflow_mvp_spec.yaml --runs-dir /tmp/ci-runs
      - name: eval suites (agents + planted trajectory fixture)
        run: |
          pmpe evals run --suite all --ledger evals/fixtures/trajectory/good_run.jsonl
      - name: drift gate holds on a planted regression
        run: |
          set +e
          pmpe drift compare --baseline evals/baselines/synthetic-baseline.json \
              --current evals/fixtures/drift/current_hard_gate_failure.json
          status=$?
          set -e
          test "$status" -eq 3 || { echo "expected HOLD (exit 3), got $status"; exit 1; }
      - name: synthetic end-to-end demo
        run: |
          pmpe demo --base-dir /tmp/ci-demo
