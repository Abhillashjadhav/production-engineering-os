name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # One immutable candidate gets one review run.  A later head has a distinct
  # group and must produce its own review evidence.
  group: pr-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  # The repository-prescribed review command writes its signed audit record and
  # may commit an approved correction; PR/issue scopes alone cannot do that.
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Never let a moving branch name change the candidate under review.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind review to exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify reviewer credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=PR Review Agent unavailable::CLAUDE_CODE_OAUTH_TOKEN is required"
            exit 1
          fi

      - name: Run Claude Code PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >-
            /review-pr. Review only immutable candidate
            ${{ github.event.pull_request.head.sha }} for PR #${{ github.event.pull_request.number }}.
          claude_args: '--max-turns 30 --allowedTools "Read,Edit,Write,Glob,Grep,LS,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,mcp__github_comment__update_claude_comment"'
          use_commit_signing: true
