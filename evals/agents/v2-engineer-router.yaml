agent: v2-engineer-router
stage: route
cases:
- id: route-valid-minimum
  kind: valid_output
  expect: valid
  hard_gate: true
  context:
    tasks: &id001
    - id: T-001
      required_capability: backend
    - id: T-002
      required_capability: test
  output:
    selected:
    - agent: v2-backend-engineer
      tasks:
      - T-001
      reason: backend task
    - agent: v2-test-engineer
      tasks:
      - T-002
      reason: test task
    not_selected: &id002
    - agent: frontend-engineer
      reason: no UI in scope
    - agent: data-migration-engineer
      reason: no migrations
    - agent: security-engineer
      reason: no new auth surface
    - agent: eval-engineer
      reason: no model behaviour
    - agent: platform-reliability-engineer
      reason: local single process
- id: route-planted-kitchen-sink
  kind: planted_failure
  expect: invalid
  context:
    tasks: *id001
  output:
    selected:
    - agent: v2-backend-engineer
      tasks:
      - T-001
      reason: backend
    - agent: v2-test-engineer
      tasks:
      - T-002
      reason: test
    - agent: v2-integration-engineer
      tasks: []
      reason: just in case
    not_selected: *id002
- id: route-planted-unexplained-omission
  kind: planted_failure
  expect: invalid
  context:
    tasks: *id001
  output:
    selected:
    - agent: v2-backend-engineer
      tasks:
      - T-001
      reason: backend
    - agent: v2-test-engineer
      tasks:
      - T-002
      reason: test
    not_selected: []
