    - finding_id: RF-999
      commits:
      - fix
      checks_rerun:
      - pytest
      changed_files:
      - src/api.py
- id: fixer-planted-no-checks-rerun
  kind: planted_failure
  expect: invalid
  context:
    accepted_finding_ids:
    - RF-001
    allowed_files:
    - src/api.py
  output:
    fixed:
    - finding_id: RF-001
      commits:
      - fix
      checks_rerun: []
      changed_files:
      - src/api.py
- id: fixer-planted-out-of-scope-file
  kind: planted_failure
  expect: invalid
  hard_gate: true
  context:
    accepted_finding_ids:
    - RF-001
    allowed_files:
    - src/api.py
  output:
    fixed:
    - finding_id: RF-001
      commits:
      - fix
      checks_rerun:
      - pytest
      changed_files:
