agent: v2-approved-findings-fixer
stage: fix
cases:
- id: fixer-valid
  kind: valid_output
  expect: valid
  hard_gate: true
  context:
    accepted_finding_ids:
    - RF-001
    allowed_files:
    - src/api.py
  output:
    fixed:
    - finding_id: RF-001
      commits:
      - fix123
      checks_rerun:
