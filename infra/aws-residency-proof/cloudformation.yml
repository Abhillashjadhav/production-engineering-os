AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal AWS Mumbai S3 residency proof for Production Engineering OS CI.

Mappings:
  ApprovedRegions:
    ap-south-1:
      Country: IN

Parameters:
  Repository:
    Type: String
    Default: Abhillashjadhav/production-engineering-os
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  GitHubEnvironment:
    Type: String
    Default: india-residency
    AllowedPattern: "^[A-Za-z0-9_.-]+$"

Resources:
  ResidencyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAbandonedSyntheticProbes
            Prefix: residency-probes/
            Status: Enabled
            ExpirationInDays: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: purpose
          Value: production-engineering-os-residency-proof
        - Key: residency
          Value: !FindInMap [ApprovedRegions, !Ref "AWS::Region", Country]

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: https://token.actions.githubusercontent.com

  GitHubResidencyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: ExactResidencyProbe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAuthenticatedBucketRegion
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                Resource: !GetAtt ResidencyBucket.Arn
              - Sid: ProbeSyntheticPrefix
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${ResidencyBucket.Arn}/residency-probes/*

Outputs:
  AwsResidencyBucket:
    Description: Set this as the AWS_RESIDENCY_BUCKET GitHub environment variable.
    Value: !Ref ResidencyBucket
  AwsResidencyRoleArn:
    Description: Set this as the AWS_RESIDENCY_ROLE_ARN GitHub environment variable.
    Value: !GetAtt GitHubResidencyRole.Arn
