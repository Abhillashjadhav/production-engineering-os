[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-evals-web-backend"
version = "0.1.0"
description = "pm-evals Web backend: deterministic eval-run comparison engine and its FastAPI transport"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "ruff==0.16.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/pm_evals_compare", "src/pm_evals_api"]

[tool.ruff]
line-length = 99
target-version = "py311"
