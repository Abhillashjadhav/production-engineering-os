# Containerized preview (PD-V3-14): built and exercised in CI, where a Docker
# daemon exists; locally the equivalent built-artifact preview runs as
# processes via scripts/preview.sh — the honest, documented seam.
services:
  backend:
    build: ./backend
    environment:
      PM_EVALS_MONITORING_DATA_DIR: /data/monitoring
      PM_EVALS_PRODUCTION_MONITORING: "1"
      # Writes fail closed when this secret is absent; set it only on trusted producers.
      PM_EVALS_INGEST_CREDENTIALS_JSON: ${PM_EVALS_INGEST_CREDENTIALS_JSON:-}
      PM_EVALS_ADJUDICATION_TOKEN: ${PM_EVALS_ADJUDICATION_TOKEN:-}
      PM_EVALS_EXPECTED_PRODUCTS_JSON: ${PM_EVALS_EXPECTED_PRODUCTS_JSON:-}
      PM_EVALS_INGEST_LIMIT_PER_MINUTE: ${PM_EVALS_INGEST_LIMIT_PER_MINUTE:-120}
    volumes:
      - monitoring-data:/data/monitoring
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  monitoring-data:
