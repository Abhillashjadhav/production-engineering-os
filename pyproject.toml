[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pmpe"
version = "0.2.0"
description = "PM Production Engineering OS — converts approved PM OS MVP specifications into tested, reviewed, deployable software."
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Abhillash Jadhav" }]
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1", "rfc8785==0.1.4"]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.3.0",
  "mypy==2.3.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
  "setuptools==83.0.0",
  "types-jsonschema==4.25.1.20251009",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
pmpe = "pmpe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmpe = ["py.typed", "schemas/*.json", "guided/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
addopts = "-q"
markers = ["e2e: full-pipeline end-to-end tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/unit/**/*.py", "tests/integration/**/*.py", "tests/e2e/**/*.py", "tests/conftest.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pmpe"]
mypy_path = "src"
